name: GFOpenIRC CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gfopennetkit at a fixed commit (its main after #2)
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopennetkit
          ref: c1b2800c3ef740066d05c08e312e546749b940f7
          path: deps/gfopennetkit
      - run: cmake -S . -B build -DNETKIT_DIR=$GITHUB_WORKSPACE/deps/gfopennetkit
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
