name: GFOpenIRC CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gfopennetkit at a fixed commit (its main after #4)
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopennetkit
          ref: 9920b44a08ad7afe4db8f7899c434949d054cc6a
          path: deps/gfopennetkit
      - run: cmake -S . -B build -DNETKIT_DIR=$GITHUB_WORKSPACE/deps/gfopennetkit
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
