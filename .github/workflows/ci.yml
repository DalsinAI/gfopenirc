name: GFOpenIRC CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gfopennetkit at a fixed commit (8326f68: gfopennetkit #4 on #2, a code for each connect step)
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopennetkit
          ref: 8326f689d4bb2e6744b0b555559598d3100b6b17
          path: deps/gfopennetkit
      # gfopenlayout (its UI, olui) for the chat window, also at a fixed commit
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopenlayout
          ref: 766e731837459d22709fa2364e6dd4d95bae95c5
          path: deps/gfopenlayout
      - run: cmake -S . -B build -DNETKIT_DIR=$GITHUB_WORKSPACE/deps/gfopennetkit -DGFOPENLAYOUT_DIR=$GITHUB_WORKSPACE/deps/gfopenlayout
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      # IRCView against stand-in Amiga headers: GCC's warnings at -O2, as the stove build sees them
      - run: >-
          gcc -std=gnu99 -O2 -Wall -Wextra -Werror -Wformat-truncation=2 -Wformat-overflow=2
          -c -Itests/amiga-stubs -Iinclude -I$GITHUB_WORKSPACE/deps/gfopennetkit/include
          -I$GITHUB_WORKSPACE/deps/gfopenlayout/include amiga/IRCView.c -o /dev/null
